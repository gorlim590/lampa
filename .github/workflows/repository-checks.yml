name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: JavaScript syntax and links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main / pull request
        uses: actions/checkout@v4
        with:
          path: main-checkout
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check whitespace errors
        working-directory: main-checkout
        run: |
          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            git diff --check HEAD^ HEAD
          else
            echo "No parent commit; skipping whitespace check."
          fi
      - name: Check JavaScript syntax and first-party links
        working-directory: main-checkout
        run: node scripts/check-repository.mjs
      - name: Header menu and Hybrid interaction regressions
        working-directory: main-checkout
        run: node --test --test-timeout=15000 tests/header-menu.cjs tests/hybrid-ui.cjs
      - name: Trakt and YDesign regressions
        working-directory: main-checkout
        run: node --test --test-timeout=15000 tests/trakt-watched-sync.cjs tests/trakt-account-isolation.cjs tests/ydesign.cjs
      - name: Anime and dorama torrent search regressions
        working-directory: main-checkout
        run: node --test --test-timeout=15000 tests/torrent-search.cjs
